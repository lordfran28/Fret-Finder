    const ef = c.e ? `<span class="ef">${esc(c.e)}</span>` : '';
    const lab = `valves ${c.f === '0' ? 'open' : c.f.split('').join(' ')}, ${c.n}${c.y && c.y !== '–' ? ', on ' + c.y : ''}, ${c.d} beats`;
    return `<div class="note${c.q ? ' q' : ''}" id="${id}" role="img" aria-label="${esc(lab)}">${c.g ? `<span class="gb">${esc(c.g)}</span>` : ''}${valves(c.f)}<span class="fg">${esc(c.f)} <span>(${esc(c.n)})</span></span>${under}${ef}<span class="du">${esc(c.d)}</span></div>`;
  }
  function barHTML(pid, b) {
    const chords = b.chords.map(c => `<span>beat ${beatLabel(c.b)}: <b>${esc(c.c)}</b></span>`).join('');
    const sung = b.sung != null ? `<p class="sung">${b.sung ? `You sing: <i>${esc(b.sung)}</i>` : 'You hold or breathe'}</p>` : '';
    const figs = b.figs ? `<ul class="figs">${b.figs.map(f => `<li><span>${esc(f)}</span></li>`).join('')}</ul>` : '';
    return `<section class="bar" aria-label="Bar ${b.lab}"><div class="bn"><span class="n">bar ${b.lab}</span><button type="button" data-from="${b.n}" data-page="${pid}">▶ from here</button></div>
      <div class="body">${b.cap ? `<p class="cap">${esc(b.cap)}</p>` : ''}${sung}${chords ? `<div class="chords">${chords}</div>` : ''}${figs}<div class="notes">${b.chips.map(c => chipHTML(pid, b.n, c)).join('')}</div></div></section>`;
  }
  const app = document.getElementById('app');
  const facts = `<ul class="facts">${HEAD.facts.map(f => `<li><span>${esc(f[0])}</span><strong>${esc(f[1])}</strong></li>`).join('')}</ul>`;
  const guide = `<div class="guide">${HEAD.guide.map(g => `<div><h4>${esc(g.h)}</h4>${g.html}</div>`).join('')}</div>`;
  const tabs = D.pages.length > 1 ? `<div class="tabs" role="group" aria-label="Pages">${D.pages.map((p, i) => `<button type="button" data-tab="${p.id}" aria-pressed="${i === 0}">${esc(p.tab)}</button>`).join('')}</div>` : '';
  const lineNames = { trumpet: 'Trumpet', voice: 'Your voice', lead: 'The tune', guitar: 'Guitar tune', chords: 'Chords' };
  const allLines = [...new Set(D.pages.flatMap(p => Object.keys(p.sound)))];
  const toggles = allLines.map(k => `<label data-line="${k}"><input type="checkbox" id="hear-${k}" checked> ${esc((D.pages.find(p => p.sound[k]).labels || {})[k] || lineNames[k] || k)}</label>`).join('');
  const player = `<div class="player" role="region" aria-label="Playback"><button type="button" class="go" id="go">▶ Play this page</button>${toggles}<span class="at" id="at" aria-live="polite">Synthesized playback of the printed rhythm at half note = 33, close to the recording.</span></div>`;
  const pagesHTML = D.pages.map((p, i) => `<div class="pg" id="pg-${p.id}" style="--acc:var(--${p.acc})" ${i ? 'hidden' : ''}><div class="pg-head"><h2>${esc(p.title)}</h2><p>${esc(p.intro)}</p></div>${p.blocks.map(B => `<div class="blk">${B.title || B.desc ? `<div class="blk-head">${B.tag ? `<span class="tag">${esc(B.tag)}</span>` : ''}${B.title ? `<h3>${esc(B.title)}</h3>` : ''}${B.desc ? `<p>${esc(B.desc)}</p>` : ''}</div>` : ''}<div class="bars">${B.bars.map(b => barHTML(p.id, b)).join('')}</div></div>`).join('')}</div>`).join('');
  app.innerHTML = `<header><span class="eyebrow">${esc(HEAD.eyebrow)}</span><h1>${esc(HEAD.h1)}</h1><p class="lede">${esc(HEAD.lede)}</p>${facts}</header>${guide}${tabs}${player}${pagesHTML}<div class="foot">${HEAD.foot.map(f => `<p>${f}</p>`).join('')}</div>`;
  app.style.setProperty('--acc', `var(--${D.pages[0].acc})`);

  let ctx = null, master = null, playing = null, raf = 0;
  let cur = D.pages[0].id;
  function show(id) {
    if (!D.pages.find(p => p.id === id)) return;
    stop(); cur = id;
    D.pages.forEach(p => { document.getElementById('pg-' + p.id).hidden = p.id !== id; });
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === id)));
    const P = D.pages.find(p => p.id === id);
    app.style.setProperty('--acc', `var(--${P.acc})`);

  }
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { show(b.dataset.tab); try { history.replaceState(null, '', '#' + b.dataset.tab); } catch (e) {} }));
  if (location.hash && location.hash.length > 1) show(location.hash.slice(1)); else show(cur);

  // ---- synth ----
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function ensure() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.8; const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function brass(t, dur, m, vol, out) {
    const g = ctx.createGain(), f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 2;
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(); o1.type = 'sawtooth'; o2.type = 'sawtooth';
    o1.frequency.value = hz(m); o2.frequency.value = hz(m); o2.detune.value = 6;
    if (dur > 0.55) { const lfo = ctx.createOscillator(), ld = ctx.createGain(); lfo.frequency.value = 5.2; ld.gain.setValueAtTime(0, t); ld.gain.linearRampToValueAtTime(7, t + Math.min(0.5, dur * 0.4)); lfo.connect(ld); ld.connect(o1.detune); ld.connect(o2.detune); lfo.start(t); lfo.stop(t + dur + 0.2); }
    f.frequency.setValueAtTime(500, t); f.frequency.linearRampToValueAtTime(2400, t + 0.06); f.frequency.linearRampToValueAtTime(1500, t + 0.25);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.045); g.gain.setValueAtTime(vol * 0.85, Math.max(t + 0.05, t + dur - 0.08)); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.06);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(out); o1.start(t); o2.start(t); o1.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
  }
  function soft(t, dur, m, vol, out, type) {
    const g = ctx.createGain(), o = ctx.createOscillator(); o.type = type || 'triangle'; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.03); g.gain.setTargetAtTime(vol * 0.6, t + 0.05, 0.4); g.gain.setTargetAtTime(0.0001, t + dur, 0.06);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.5);
  }
  function pluck(t, dur, m, vol, out) {
    const g = ctx.createGain(), o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = hz(m);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.3, Math.min(dur, 1.2)));

  }
  function stop() {
    if (playing) { try { playing.bus.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.03); const b = playing.bus; setTimeout(() => b.disconnect(), 300); } catch (e) {} playing = null; }
    cancelAnimationFrame(raf); document.querySelectorAll('.note.now').forEach(e => e.classList.remove('now'));
    const go = document.getElementById('go'); go.textContent = '▶ Play this page'; go.classList.remove('stop');
  }
  /* while it plays, the page follows the note that is sounding; a hand on the page pauses that for a moment */
  let handAt = 0;
  ['wheel', 'touchstart', 'touchmove'].forEach(ev => window.addEventListener(ev, () => { handAt = Date.now(); }, { passive: true }));
  function follow(el) {
    if (Date.now() - handAt < 2500) return;
    const pl = document.querySelector('.player'), top = pl ? Math.max(0, pl.getBoundingClientRect().bottom) : 0;
    const r = el.getBoundingClientRect(), h = window.innerHeight;
    if (r.top >= top + 16 && r.bottom <= top + (h - top) * 0.7) return;

  function play(fromBar) {

    const P = D.pages.find(p => p.id === cur);
    const x0 = (fromBar - 1) * BL, x1 = P.end;
    const bus = ctx.createGain(); bus.connect(master);

      if (!on(k)) return;

        const b = a + l; if (b <= x0 || a >= x1) return;

        if (k === 'trumpet' || k === 'lead') brass(T(s), dur, m, 0.16, bus);
        else if (k === 'guitar') pluck(T(s), dur, m, 0.13, bus);
        else soft(T(s), dur, m, 0.09, bus, 'triangle');
      });
    });
    if (on('chords')) {
      const ch = D.chords;
      ch.forEach((c, i) => {
        const a = c[0], b = i + 1 < ch.length ? ch[i + 1][0] : x1; if (b <= x0 || a >= x1) return;

    const go = document.getElementById('go'); go.textContent = '■ Stop'; go.classList.add('stop');
    const idx = (chipIndex[P.id] || []).map(([a, b, id]) => [T(a), T(b), id]);
    const at = document.getElementById('at');
    let lit = null;
    const tick = () => {
      if (!playing) return;
      const now = ctx.currentTime;
      if (now > tEnd) { stop(); return; }
      const hit = idx.find(([a, b]) => now >= a && now < b);
      const id = hit ? hit[2] : null;
      if (id !== lit) { if (lit) { const o = document.getElementById(lit); if (o) o.classList.remove('now'); } if (id) { const e = document.getElementById(id); if (e) { e.classList.add('now'); follow(e); } } lit = id; }
      // bar label
      let x = x0; for (let k = 0; k < 4000 && T(x + 1) <= now; k++) x++;
      at.innerHTML = `<b>bar ${Math.floor(x / BL) + 1 - (P.off || 0)}</b> · beat ${Math.floor((x % BL) / 4) + 1}`;
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  document.getElementById('go').addEventListener('click', () => {
    if (playing) { stop(); return; }
    const P = D.pages.find(p => p.id === cur);
    const first = P.blocks[0].bars[0].n; play(first);
  });

})();
</script>

function line(chips, label, opts){ opts = opts || {}; const id = 'tl' + (LID++); LINES[id] = {seq: chips.map(c => c.r ? [null, c.b] : [c.m, c.b]), with: opts.with || null};
  const lab = label ? `<span class="lb">${esc(label)}</span>` : '';
  return `<div class="tc-line" data-l="${id}">${lab}<button class="tc-play" type="button" aria-label="Play ${esc(label || 'this line')}">▶</button><div class="tc-chips">${chips.map((c, i) => chipH(c, {i, diff: opts.diff && opts.diff[i], x: opts.x && opts.x[i]})).join('')}</div></div>`; }

/* ---------- brass synth ---------- */
let ctx = null, stopAt = 0, timers = [], live = [], onBtn = null;
function ac(){ if (!ctx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ctx = new A(); } if (ctx.state === 'suspended') ctx.resume(); return ctx; }
function tone(m, t, dur, vol){ const f = 440 * Math.pow(2, (m - 69) / 12);
  const o = ctx.createOscillator(), o2 = ctx.createOscillator(), fl = ctx.createBiquadFilter(), g = ctx.createGain(), g2 = ctx.createGain();
  o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = f; o2.frequency.value = f; g2.gain.value = 0.35;
  fl.type = 'lowpass'; fl.Q.value = 1.4; fl.frequency.setValueAtTime(f * 1.2, t); fl.frequency.linearRampToValueAtTime(Math.min(9000, f * 7), t + 0.05); fl.frequency.linearRampToValueAtTime(Math.min(7000, f * 4.2), t + Math.max(0.08, dur));
  const v = vol || 0.16, rel = 0.06;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.035); g.gain.setValueAtTime(v * 0.9, t + Math.max(0.04, dur - rel)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.04);
  if (dur > 0.7) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 5.3; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.006, t + 0.45); l.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency); l.start(t); l.stop(t + dur + 0.1); live.push(l); }
  o.connect(fl); o2.connect(g2); g2.connect(fl); fl.connect(g); g.connect(ctx.destination);
  o.start(t); o2.start(t); o.stop(t + dur + 0.1); o2.stop(t + dur + 0.1); live.push(o, o2); }
function stopAll(){ const t = ctx ? ctx.currentTime : 0; live.forEach(x => { try { x.stop(t + 0.02); } catch (e) {} }); live = []; timers.forEach(clearTimeout); timers = [];
  root.querySelectorAll('.tc-chip.now').forEach(x => x.classList.remove('now')); if (onBtn) { onBtn.classList.remove('on'); onBtn.textContent = '▶'; } onBtn = null; }
function play(id, btn){ const L = LINES[id]; if (!L) return; const was = onBtn === btn; stopAll(); if (was) return; if (!ac()) return;
  onBtn = btn; btn.classList.add('on'); btn.textContent = '■';
  const spb = C.spb, t0 = ctx.currentTime + 0.08; let t = 0; const el = btn.parentElement;
  const chipsEl = el.querySelectorAll('.tc-chip');
  L.seq.forEach(([m, b], i) => { const d = Math.max(0.06, b * spb);
    if (m != null) tone(m, t0 + t, d * 0.95);
    const k = i; timers.push(setTimeout(() => { chipsEl.forEach(x => x.classList.remove('now')); if (chipsEl[k]) chipsEl[k].classList.add('now'); }, (0.08 + t) * 1000));
    t += d; });
  if (L.with) { let u = 0; L.with.forEach(([m, b]) => { const d = Math.max(0.06, b * spb); if (m != null) tone(m, t0 + u, d * 0.95, 0.11); u += d; }); t = Math.max(t, u); }
  timers.push(setTimeout(() => { if (onBtn === btn) stopAll(); }, (t + 0.4) * 1000)); }
root.addEventListener('click', e => { const b = e.target.closest('.tc-play'); if (!b) return; play(b.parentElement.dataset.l, b); });

/* ---------- sections ---------- */
const S = [];
const sec = (id, eyebrow, title, p, body) => S.push(`<section class="tc-sec" id="${id}"><div class="tc-h"><span class="tc-eyebrow">${eyebrow}</span><h2>${title}</h2>${p ? `<p>${p}</p>` : ''}</div>${body}</section>`);
const where = (s, a, b) => `${s ? esc(s) + ' · ' : ''}${a === b ? 'bar ' + esc(a) : 'bars ' + esc(a) + '–' + esc(b)}`;
const det = (title, sub, inner, open) => `<details class="tc-part"${open ? ' open' : ''}><summary><h3>${esc(title)}</h3><span>${esc(sub)}</span></summary><div class="tc-in">${inner}</div></details>`;

// 1. notes and fingerings
if (C.table && C.table.length) {
  const cards = C.table.map(r => `<div class="tc-card"><div class="hd"><span class="big">${esc(r.name)}</span><span class="sm">${r.n}× in the part</span></div>
    <div class="tc-alt">${dots(r.f)}<span><b>${fl(r.f)}</b> as on the page${r.other.length ? ` (also ${r.other.map(fl).join(', ')} in places)` : ''}</span></div>
    ${r.tend ? `<span class="tend">${esc(r.tend)}</span>` : ''}
    ${r.alts.map(a => `<div class="tc-alt">${dots(a.f)}<span><b>${fl(a.f)}</b>${a.why ? ' · ' + esc(a.why) : ''}${a.tend ? ' · ' + esc(a.tend) : ''}</span></div>`).join('')}
    <span class="sm">${r.where.map(w => esc((w[0] ? w[0] + ' ' : '') + w[1])).join(', ')}</span></div>`).join('');
  sec('tc-notes', 'Every note', 'Every note, every fingering', 'Each note the part uses, low to high: the fingering on the page, then every other way to play it on a B♭ trumpet and what each one is good for. Where a note tends to sit out of tune on most horns, it says so.', `<div class="tc-grid">${cards}</div>`);
}
// 2. valves
{
  let body = '';
  if (C.slurs && C.slurs.length) body += det('Lip slurs in the part', C.slurs.length + ' pairs', `<p class="tc-note">These steps keep the same valves: the lips move the note, the fingers stay still. Practise each pair as a slow slur, then in rhythm.</p><div class="tc-grid">${C.slurs.map(s => `<div class="tc-card"><div class="hd"><b>${esc(s.a)} → ${esc(s.b)}</b><span class="sm">${s.n}×</span></div>${line([{m: s.ma, n: s.a, f: s.f, d: '1', b: 1}, {m: s.mb, n: s.b, f: s.f, d: '1', b: 1}, {m: s.ma, n: s.a, f: s.f, d: '1', b: 1}, {m: s.mb, n: s.b, f: s.f, d: '1', b: 1}], '')}<span class="sm">bars ${s.bars.map(esc).join(', ')}</span></div>`).join('')}</div>`, true);
  if (C.runs && C.runs.length) body += det('Easier fingerings in the quick runs', C.runs.length + ' runs', C.runs.map(r => `<div class="tc-item"><div class="ih"><span class="tc-ty">FEWER MOVES</span><span class="w">${where(r.sec, r.a, r.b)}</span></div><p>Valve changes ${r.cost} → ${r.cost2}. The shaded notes change fingering; the pitch stays the same.</p>${line(r.chips, 'As on the page')}${line(r.alt_chips, 'With alternates', {diff: r.page.map((f, i) => f !== r.alt[i])})}</div>`).join(''), false);
  if (body) sec('tc-valves', 'The fingers', 'Lip slurs and easier fingerings', 'Where the fingers can rest, and where an alternate fingering saves work in quick notes.', body);
}
// 3. phrases
if (C.phrases && C.phrases.length) {
  const by = {}; C.phrases.forEach(p => (by[p.sec] = by[p.sec] || []).push(p));
  const body = Object.entries(by).map(([s, ps], gi) => det(s, ps.length + ' phrases', ps.map(p => `<div class="tc-item"><div class="ih"><span class="tc-ty cool">PHRASE</span><span class="w">${where('', p.a, p.b)}</span></div>
    <div class="tc-meta"><span><b>${p.secs} s</b> on one breath at this tempo</span><span>range <b>${esc(p.lo)}–${esc(p.hi)}</b></span>${p.breath.length ? p.breath.map(b => `<span>catch a breath after <b>${esc(b.after)}</b> in bar ${esc(b.bar)}</span>`).join('') : ''}</div>
    ${line(p.orig, 'As written')}${p.up ? line(p.up, 'An octave up' + (p.up_high ? ' (goes above F5)' : '')) : ''}${p.down ? line(p.down, 'An octave down') : ''}</div>`).join(''), gi === 0)).join('');
  sec('tc-phr', 'Breathing and octaves', 'Every phrase, its breath and its octaves', 'The part split where it rests, with how long each phrase lasts at the page’s tempo and where to sneak a breath in the long ones. Under each, the same phrase an octave up or down when it fits the horn.', body);
}
// 4. ornaments
if (C.orn && C.orn.length) sec('tc-orn', C.style === 'classical' ? 'Ornaments' : 'Inflections', C.style === 'classical' ? 'Ornaments in the style' : 'Jazz inflections', C.style === 'classical' ? 'Trills, appoggiaturas, turns and swells, each on a spot in this piece where it belongs. Use one or two per phrase at most.' : 'Scoops, falls, shakes, doits and bends, each on a spot in this tune where it fits. A few per chorus, not every phrase.',
  C.orn.map(o => `<div class="tc-item"><div class="ih"><span class="tc-ty">${esc(o.kind.toUpperCase())}</span><span class="w">${where(o.sec, o.bar, o.bar)} · on ${esc(o.on)}</span></div><p>${esc(o.how)}</p>${line(o.chips, '')}</div>`).join(''));
// 5. variations
if (C.vars && C.vars.length) sec('tc-var', 'Variations', 'The melody, varied', 'Phrases from the part, each followed by versions with notes added or moved. For a second time through, or to make a long note speak.',
  C.vars.map((v, i) => det(where(v.sec, v.a, v.b), v.vars.length + ' versions', line(v.orig, 'As written') + v.vars.map(x => `<div class="tc-item"><h4>${esc(x.t)}</h4><p>${esc(x.why)}</p>${line(x.chips, '')}</div>`).join(''), i === 0)).join(''));
// 6. second parts
if (C.harm && C.harm.length) sec('tc-harm', 'Second parts', 'Harmony lines', 'Lines to play with the tune: for a second trumpet, for an overdub, or as a part of your own under a singer. ▶ on “Together” plays both.',
  C.harm.map((h, i) => det(h.t, h.where, `<p class="tc-note">${esc(h.why)}</p>` + (h.names ? `<p class="tc-note">Chords: ${h.names.map(esc).join(' · ')}</p>` : '') + line(h.chips, 'The line') + (h.mel && !h.names ? line(h.mel, 'Together', {with: h.chips.map(c => c.r ? [null, c.b] : [c.m, c.b])}) : ''), i === 0)).join(''));
// 7. arpeggios
if (C.arps && C.arps.length) sec('tc-arp', 'For improvising', 'Arpeggios and scales for every chord', 'Each chord of the tune as an arpeggio in a comfortable octave, with the scale that goes over it. The raw material for fills and solos.',
  det('All ' + C.arps.length + ' chords', 'in the order they first appear', C.arps.map(a => `<div class="tc-item"><div class="ih"><span class="tc-ty cool">${esc(a.c)}</span><span class="w">first in ${where(a.sec, a.bar, a.bar)} · scale: ${esc(a.scale)}</span></div>${line(a.arp, 'Arpeggio')}${line(a.scale_chips, 'Scale')}</div>`).join(''), true));
// 8. intros & endings
if (C.ie && C.ie.length) sec('tc-ie', 'Ways in and out', 'Intros and endings', 'Other ways to start and finish, built from this tune’s own notes and key.',
  C.ie.map(x => `<div class="tc-item"><div class="ih"><span class="tc-ty${x.kind === 'Intro' ? ' cool' : ''}">${esc(x.kind.toUpperCase())}</span></div><h4>${esc(x.t)}</h4><p>${esc(x.why)}</p>${line(x.chips, '', {x: x.labels})}</div>`).join(''));
// 9. drills
if (C.drills && C.drills.length) sec('tc-drill', 'Practice', 'What to practise first', 'The hardest phrases in the part, hardest first, with what makes each one hard. Slur them slowly, then tongue them, then bring them up to tempo.',
  C.drills.map((d, i) => `<div class="tc-item"><div class="ih"><span class="tc-ty">${i + 1}</span><span class="w">${where(d.sec, d.a, d.b)}</span></div><p>${d.why.length ? 'Hard because of ' + esc(d.why.join(', ')) + '.' : 'Long and exposed.'}</p>${line(d.chips, '')}</div>`).join(''));

const NAV = [['tc-notes','Every note'],['tc-valves','Fingers'],['tc-phr','Phrases'],['tc-orn', C.style === 'classical' ? 'Ornaments' : 'Inflections'],['tc-var','Variations'],['tc-harm','Harmony'],['tc-arp','Arpeggios'],['tc-ie','Intros & endings'],['tc-drill','Practice']];
const body = S.join('');
const holder = document.createElement('div'); holder.className = 'tc-body'; root.appendChild(holder);
holder.innerHTML = `<div style="display:grid;gap:10px"><span class="tc-eyebrow">The compendium</span><h2>${esc(C.title)}</h2><p class="tc-lede">${esc(C.lede)}</p><nav class="tc-nav" aria-label="Compendium">${NAV.filter(([id]) => body.includes('id="' + id + '"')).map(([id, t]) => `<a href="#${id}">${t}</a>`).join('')}</nav></div>` + body;
})();
</script>
